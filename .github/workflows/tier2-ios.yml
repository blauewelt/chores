name: tier2-ios
# S1 aus TESTING_TIER2.md: Safari im iOS-Simulator oeffnet den persoenlichen
# Deep-Link (Scan-Aequivalent). Assertion per Screenshot-OCR (tesseract) —
# bewusst ohne Appium/WebDriverAgent fuer den Einstieg. Dispatch-only.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # nightly 03:17 UTC

jobs:
  s1-safari-openurl:
    # macos-15 seit 23.08.2026 (macos-14 wird abgekuendigt; hier reicht
    # tesseract als Bottle — KEIN idb: idb-companion verlangt inzwischen
    # eine volle Xcode-26-Installation, die kein gehostetes Image hat).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot simulator
        run: |
          # Kein fester Modellname: mit dem Runner-Image wandert auch die
          # Simulator-Generation (macos-15 bringt keine iPhone-14/15-Geraete
          # mehr garantiert mit). Erst die bekannten Modelle probieren, sonst
          # IRGENDEIN verfuegbares iPhone — und ehrlich abbrechen, wenn es
          # keines gibt, statt mit leerem DEVICE weiterzulaufen.
          LIST=$(xcrun simctl list devices available)
          DEVICE=$(echo "$LIST" | grep -E "iPhone 1[4-9]" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          [ -n "$DEVICE" ] || DEVICE=$(echo "$LIST" | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$DEVICE" ]; then echo "FEHLER: kein iPhone-Simulator im Image"; echo "$LIST" | head -30; exit 1; fi
          echo "$LIST" | grep "$DEVICE"
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Install tesseract
        run: |
          brew install tesseract
          /usr/bin/python3 -m pip install --user --quiet pillow \
            || /usr/bin/python3 -m pip install --user --break-system-packages --quiet pillow

      - name: Open personal deep link in Safari
        run: |
          URL="https://blauewelt.github.io/chores/f/fam-e2e-fairli01/u/e2etest0001"
          xcrun simctl openurl "$DEVICE" "$URL"
          sleep 15
          xcrun simctl io "$DEVICE" screenshot s1.png

      - name: OCR assertion
        run: |
          # ZWEI Durchgaenge. Das modale Onboarding «Zugriff sichern»
          # (v4.45.0) steht bei JEDEM Erstbesuch vor der App, und ein frisch
          # gebooteter Simulator ist immer ein Erstbesuch. Die verriegelte
          # Sicht liegt dahinter VOLLSTAENDIG vor — Haushaltsname,
          # ICH-BIN-Chip, Tabs — nur abgedunkelt. Genau daran scheiterte der
          # Lauf tagelang (Befund 23.08.2026): das Bild trug den Beweis, die
          # OCR las ihn nicht. Also zusaetzlich eine kontrastverstaerkte
          # Fassung des oberen Bereichs lesen, statt den Dialog wegzutippen
          # (idb-companion baut auf den gehosteten Runnern nicht mehr).
          tesseract s1.png out -l eng 2>/dev/null
          /usr/bin/python3 scripts/ocr-boost.py s1.png s1-boost.png 0.45
          tesseract s1-boost.png boost -l eng 2>/dev/null
          cat boost.txt >> out.txt
          echo "--- OCR-Auszug ---"; head -40 out.txt
          echo "--- Assertion: Haushalts-Titel + App-UI sichtbar, keine Einstiegsseite ---"
          # OCR-tauglich: grosser Titel «E2E Testhaushalt» statt des kleinen
          # ICH-BIN-Chips («Testperson» war OCR zu klein — Lauf 1 zeigte die
          # korrekte Mitglieder-Sicht, scheiterte nur an dieser Zeile)
          # Der Simulator laeuft auf Englisch — die App uebersetzt sich mit.
          # Beide Sprachen zulassen, sonst misst der Test die Runner-Locale.
          grep -qi "Testhaushalt" out.txt
          grep -qiE "Verlauf|Aufgabe|Punkte|History|Task|Point" out.txt
          ! grep -qiE "Haushalt erstellen|Create .*household" out.txt
          echo "S1 GRUEN: verriegelte Sicht in echtem iOS-Safari erreicht"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-artifacts
          path: |
            s1.png
            s1-boost.png
            out.txt
