name: tier2-ios-capture
# Testet MAINTAINER-HYPOTHESE (12.07.): «Beim Hinzufuegen zum Home-Bildschirm
# wird nur die Basis-URL gespeichert.» Ablauf: Safari oeffnet den
# Familien-Deep-Link → Share-Sheet → «Add to Home Screen» → «Add» → dann
# wird die GROUND TRUTH gelesen: die frisch erzeugte
# WebClips/<X>.webclip/Info.plist im Simulator-Dateisystem.
# GRUEN  = eingebackene URL enthaelt den Familien-Pfad (Capture korrekt).
# ROT    = Basis-URL eingebacken → Hypothese bestaetigt, systemischer Bug.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'   # nightly 03:37 UTC — Regressionswache fuer die Capture-Semantik

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  capture:
    # macos-26 seit 23.08.2026. Zwei Stufen an EINEM Tag gelernt: auf
    # macos-14 lehnt idb-companion mit «older than Sequoia» ab, auf macos-15
    # verlangt es eine VOLLE Xcode-26-Installation — die gibt es erst im
    # macOS-26-Image (= macos-latest). Vorher war der Lauf rot, bevor
    # ueberhaupt etwas getestet wurde.
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator
        run: |
          # Kein fester Modellname (23.08.2026): mit dem Runner-Image wandert
          # die Simulator-Generation mit — auf macos-26 gibt es kein
          # «iPhone 15 Pro» mehr, und der Lauf starb an einem leeren DEVICE.
          LIST=$(xcrun simctl list devices available)
          DEVICE=$(echo "$LIST" | grep -E "iPhone 1[5-9] Pro \(|iPhone 2[0-9] Pro \(" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          [ -n "$DEVICE" ] || DEVICE=$(echo "$LIST" | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$DEVICE" ]; then echo "FEHLER: kein iPhone-Simulator im Image"; echo "$LIST" | head -30; exit 1; fi
          echo "$LIST" | grep "$DEVICE"
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcrun simctl erase "$DEVICE"
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          sleep 5

      - name: Install idb
        run: |
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion tesseract
          /usr/bin/python3 -m pip install --user --quiet pytesseract pillow
          /usr/bin/python3 -m ensurepip --user 2>/dev/null || true
          /usr/bin/python3 -m pip install --user --quiet fb-idb
          USERBIN=$(/usr/bin/python3 -m site --user-base)/bin
          echo "$USERBIN" >> $GITHUB_PATH
          # Companion primen — ohne das liefert describe-all leere Antworten
          "$USERBIN/idb" list-targets | head -3
          "$USERBIN/idb" connect "$DEVICE" || true
          sleep 3

      - name: Open family deep link in Safari
        run: |
          xcrun simctl openurl "$DEVICE" "https://blauewelt.github.io/chores/f/fam-e2e-fairli01"
          sleep 12
          xcrun simctl io "$DEVICE" screenshot 1-loaded.png

      - name: Dismiss first-visit onboarding
        run: |
          # «Zugriff sichern» (v4.45.0) ist modal und liegt bei jedem
          # Erstbesuch UEBER der Seite — ein frisch geloeschter Simulator ist
          # immer ein Erstbesuch. Befund 23.08.2026: der Koordinaten-Tap auf
          # Safaris Teilen-Knopf landete deshalb im App-Sheet, und die OCR des
          # «Share-Sheets» las das Onboarding. Erst wegtippen, dann teilen.
          for label in "Let's go" "Los geht"; do
            /usr/bin/python3 scripts/ocr-tap.py "$DEVICE" 1-loaded.png "$label" && break || true
          done
          sleep 3
          xcrun simctl io "$DEVICE" screenshot 1b-app.png

      - name: Share sheet → Add to Home Screen → Add
        run: |
          # Safaris Teilen-Knopf traegt keinen Text (Glyphe) — also Koordinate.
          # Nicht mehr hartkodiert (23.08.2026): mit dem Runner-Image wandert
          # die Geraetegroesse (402x874 statt 393x852). In Safaris unterer
          # Leiste liegt Teilen MITTIG, knapp ueber dem Home-Indikator.
          SIZE=$(idb describe --udid "$DEVICE" --json 2>/dev/null | /usr/bin/python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('screen_dimensions',{}).get('width_points',393), d.get('screen_dimensions',{}).get('height_points',852))" \
            || echo "393 852")
          W=$(echo $SIZE | cut -d' ' -f1); H=$(echo $SIZE | cut -d' ' -f2)
          TX=$((W / 2)); TY=$((H - 40))
          echo "Geraet ${W}x${H} pt → Teilen-Tap @ $TX,$TY"
          echo "OCR_TAP_PT_WIDTH=$W" >> $GITHUB_ENV
          export OCR_TAP_PT_WIDTH=$W
          idb ui tap --udid "$DEVICE" "$TX" "$TY"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot 2-sheet.png
          /usr/bin/python3 scripts/ocr-tap.py "$DEVICE" 2-sheet.png "Add to Home Screen" || {
            echo "unter dem Falz — im Sheet hochwischen"
            idb ui swipe --udid "$DEVICE" $((W/2)) $((H*85/100)) $((W/2)) $((H*40/100))
            sleep 2
            xcrun simctl io "$DEVICE" screenshot 2b-sheet.png
            /usr/bin/python3 scripts/ocr-tap.py "$DEVICE" 2b-sheet.png "Add to Home Screen"
          }
          sleep 3
          xcrun simctl io "$DEVICE" screenshot 3-edit.png
          /usr/bin/python3 scripts/ocr-tap.py "$DEVICE" 3-edit.png "Add" --exact
          sleep 4
          xcrun simctl io "$DEVICE" screenshot 4-after.png

      - name: "GROUND TRUTH: read the freshly baked Web Clip plist"
        run: |
          CLIPS=~/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/WebClips
          ls -la "$CLIPS" || { echo "FEHLER: kein WebClip erzeugt"; exit 1; }
          PLIST=$(ls -d "$CLIPS"/*.webclip | head -1)/Info.plist
          echo "--- $PLIST ---"
          plutil -p "$PLIST" | tee plist.txt
          URL=$(plutil -extract URL raw "$PLIST")
          echo "Eingebackene URL: $URL"
          if echo "$URL" | grep -q "/f/fam-e2e-fairli01"; then
            echo "CAPTURE KORREKT: aktuelle Deep-URL wurde eingebacken"
          else
            echo "HYPOTHESE BESTAETIGT: nur Basis-URL eingebacken — systemischer Bug!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-artifacts
          path: |
            1-loaded.png
            1b-app.png
            2-sheet.png
            3-edit.png
            4-after.png
            plist.txt
            2b-sheet.png
