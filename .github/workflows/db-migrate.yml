name: db-migrate
# Automatischer Migrations-Fluss (28.07.2026): Migrationen wenden sich beim
# Push selbst an — jede Aenderung unter supabase/migrations/ triggert den
# Lauf. Sicher, weil ALLE Migrationen idempotent sind (if not exists /
# create or replace); der Lauf wendet stets die komplette Liste an.
# workflow_dispatch bleibt fuer manuelles Nachfahren erhalten.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql -h aws-1-eu-north-1.pooler.supabase.com -p 5432 -d postgres \
                 -U postgres.uggipomhmnnmiqpbpxcc -v ON_ERROR_STOP=1 -f "$f"
          done
